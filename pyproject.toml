[project]
name = "weight-space-pii"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "datasets==5.1.0",
    "huggingface-hub==2.4.0",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==26.0.1",
    "safetensors==0.8.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "tokenizers==0.23.3",
    "torch==2.15.0",
    "transformers==5.22.1",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wsp"
