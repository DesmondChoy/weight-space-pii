<svg xmlns="http://www.w3.org/2000/svg" width="960" height="352" viewBox="0 0 960 352" role="img">
<title>Where each set comes from</title>
<desc>Three sources pass a filter into three sets. openpii train becomes the 1,000-row practice set, the only set the editor sees. openpii validation becomes the 5,004-row main eval, and Nemotron's held-out split becomes the 18,515-row regression check. Both are hidden from the editor.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tl { font-size: 11px; fill: #5F5E5A; }
.mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; fill: #2C2C2A; }
.box rect { fill: #F1EFE8; stroke: #888780; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; } .c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
.c-coral rect, rect.c-coral { fill: #FAECE7; stroke: #993C1D; } .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
rect.sc { fill: #E1F5EE; stroke: #0F6E56; } text.sc { fill: #085041; font-weight: 500; }
rect.dr { fill: none; stroke: #888780; stroke-dasharray: 4 3; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
.card { fill: #FAFAF7; stroke: #E5E3DA; }
rect.tag { fill: #FBEAF0; stroke: #993556; }
.tv { font-size: 12px; font-weight: 500; fill: #2C2C2A; }
.ok { font-size: 12px; font-weight: 500; fill: #3B6D11; } .bad { font-size: 12px; font-weight: 500; fill: #A32D2D; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="960" height="352" fill="#FFFFFF"/>
<text class="ts" x="160" y="24" text-anchor="middle" dominant-baseline="central">Source</text>
<text class="ts" x="479" y="24" text-anchor="middle" dominant-baseline="central">Filter</text>
<text class="ts" x="800" y="24" text-anchor="middle" dominant-baseline="central">Set</text>
<g class="box"><rect x="40" y="44" width="240" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="160" y="69" text-anchor="middle" dominant-baseline="central">openpii train</text>
<text class="ts" x="160" y="87" text-anchor="middle" dominant-baseline="central">20,225 Singapore rows</text>
</g>
<path d="M282 77 L676 77" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="479" y="65" text-anchor="middle" dominant-baseline="central">filter to 20,211, then sample 1,000</text>
<text class="tl" x="479" y="90" text-anchor="middle" dominant-baseline="central">drops long, duplicate, and shared texts</text>
<g class="c-teal"><rect x="680" y="44" width="240" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="800" y="61" text-anchor="middle" dominant-baseline="central">Practice set</text>
<text class="ts" x="800" y="79" text-anchor="middle" dominant-baseline="central">1,000 rows</text>
<text class="ts" x="800" y="95" text-anchor="middle" dominant-baseline="central">editor sees rows and answers</text>
</g>
<g class="box"><rect x="40" y="134" width="240" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="160" y="159" text-anchor="middle" dominant-baseline="central">openpii validation</text>
<text class="ts" x="160" y="177" text-anchor="middle" dominant-baseline="central">5,005 Singapore rows</text>
</g>
<path d="M282 167 L676 167" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="479" y="155" text-anchor="middle" dominant-baseline="central">filter to 5,004</text>
<text class="tl" x="479" y="180" text-anchor="middle" dominant-baseline="central">drops 1 duplicate text</text>
<g class="c-coral"><rect x="680" y="134" width="240" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="800" y="151" text-anchor="middle" dominant-baseline="central">Main eval</text>
<text class="ts" x="800" y="169" text-anchor="middle" dominant-baseline="central">5,004 rows</text>
<text class="ts" x="800" y="185" text-anchor="middle" dominant-baseline="central">hidden, Singapore score</text>
</g>
<g class="box"><rect x="40" y="224" width="240" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="160" y="249" text-anchor="middle" dominant-baseline="central">Nemotron held-out</text>
<text class="ts" x="160" y="267" text-anchor="middle" dominant-baseline="central">20,000 rows, never trained on</text>
</g>
<path d="M282 257 L676 257" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="479" y="245" text-anchor="middle" dominant-baseline="central">filter to 18,515</text>
<text class="tl" x="479" y="270" text-anchor="middle" dominant-baseline="central">drops 1,485 rows over 512 tokens</text>
<g class="c-coral"><rect x="680" y="224" width="240" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="800" y="241" text-anchor="middle" dominant-baseline="central">Regression check</text>
<text class="ts" x="800" y="259" text-anchor="middle" dominant-baseline="central">18,515 rows</text>
<text class="ts" x="800" y="275" text-anchor="middle" dominant-baseline="central">hidden, Nemotron score</text>
</g>
<line x1="660" y1="122" x2="940" y2="122" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<rect class="c-teal" x="40" y="323" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="62" y="330" text-anchor="start" dominant-baseline="central">Editor can see</text>
<rect class="c-coral" x="200" y="323" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="222" y="330" text-anchor="start" dominant-baseline="central">Hidden from editor</text>
</svg>
