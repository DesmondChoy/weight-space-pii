<svg xmlns="http://www.w3.org/2000/svg" width="960" height="606" viewBox="0 0 960 606" role="img">
<title>Where the submitted edit changes MiniLM</title>
<desc>MiniLM's six layers, each with an attention block and an MLP. The submitted edit changes only the MLPs of layers 1, 2 and 4. Layers 1 and 2 hold the title repair: neurons 54 and 485 in layer 1, and 792, 1209, 244 and 1258 in layer 2. Layer 4 holds the NRIC repair, neurons 806 and 1407. A repair for hyphenated names in layer 5 was tried and dropped. Every attention block is unchanged, and edits to the embeddings and the classification head are not allowed. In all, 12 tensors and 7,304 numbers change.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tl { font-size: 11px; fill: #5F5E5A; }
.mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; fill: #2C2C2A; }
.box rect { fill: #F1EFE8; stroke: #888780; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; } .c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
.c-coral rect, rect.c-coral { fill: #FAECE7; stroke: #993C1D; } .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
rect.sc { fill: #E1F5EE; stroke: #0F6E56; } text.sc { fill: #085041; font-weight: 500; }
rect.dr { fill: none; stroke: #888780; stroke-dasharray: 4 3; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
.card { fill: #FAFAF7; stroke: #E5E3DA; }
rect.tag { fill: #FBEAF0; stroke: #993556; }
.tv { font-size: 12px; font-weight: 500; fill: #2C2C2A; }
.ok { font-size: 12px; font-weight: 500; fill: #3B6D11; } .bad { font-size: 12px; font-weight: 500; fill: #A32D2D; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="960" height="606" fill="#FFFFFF"/>
<text class="th" x="40" y="22" text-anchor="start" dominant-baseline="central">Where the submitted edit changes MiniLM</text>
<text class="ts" x="40" y="42" text-anchor="start" dominant-baseline="central">MiniLM's six layers, bottom to top in the order a text passes through them. Each layer has an attention block and an MLP of 1,536 neurons.</text>
<g class="c-coral"><rect x="130" y="64" width="420" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="78" text-anchor="middle" dominant-baseline="central">Classification head</text>
<text class="ts" x="340" y="96" text-anchor="middle" dominant-baseline="central">edits refused by save_edit</text>
</g>
<text class="ts" x="40" y="144" text-anchor="start" dominant-baseline="central">Layer 5</text>
<g class="box"><rect x="130" y="124" width="170" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="215" y="136" text-anchor="middle" dominant-baseline="central">Attention</text>
<text class="ts" x="215" y="154" text-anchor="middle" dominant-baseline="central">unchanged</text>
</g>
<rect class="dr" x="320" y="124" width="230" height="40" rx="8" stroke-width="1"/>
<text class="th" x="435" y="136" text-anchor="middle" dominant-baseline="central">MLP</text>
<text class="ts" x="435" y="154" text-anchor="middle" dominant-baseline="central">tried, not submitted</text>
<text class="tl" x="570" y="136" text-anchor="start" dominant-baseline="central">Hyphenated names, neurons 161, 423, 541, 665.</text>
<text class="tl" x="570" y="152" text-anchor="start" dominant-baseline="central">Dropped: gain on the held-back half +0.014 ± 0.015.</text>
<text class="ts" x="40" y="200" text-anchor="start" dominant-baseline="central">Layer 4</text>
<g class="box"><rect x="130" y="180" width="170" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="215" y="192" text-anchor="middle" dominant-baseline="central">Attention</text>
<text class="ts" x="215" y="210" text-anchor="middle" dominant-baseline="central">unchanged</text>
</g>
<g class="c-teal"><rect x="320" y="180" width="230" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="435" y="192" text-anchor="middle" dominant-baseline="central">MLP</text>
<text class="ts" x="435" y="210" text-anchor="middle" dominant-baseline="central">2 neurons edited</text>
</g>
<text class="ts" x="570" y="192" text-anchor="start" dominant-baseline="central">NRIC repair, neurons 806 and 1407.</text>
<text class="ts" x="570" y="208" text-anchor="start" dominant-baseline="central">They detect the NRIC shape and write the national-ID state.</text>
<text class="ts" x="40" y="256" text-anchor="start" dominant-baseline="central">Layer 3</text>
<g class="box"><rect x="130" y="236" width="170" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="215" y="248" text-anchor="middle" dominant-baseline="central">Attention</text>
<text class="ts" x="215" y="266" text-anchor="middle" dominant-baseline="central">unchanged</text>
</g>
<g class="box"><rect x="320" y="236" width="230" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="435" y="248" text-anchor="middle" dominant-baseline="central">MLP</text>
<text class="ts" x="435" y="266" text-anchor="middle" dominant-baseline="central">unchanged</text>
</g>
<text class="ts" x="40" y="312" text-anchor="start" dominant-baseline="central">Layer 2</text>
<g class="box"><rect x="130" y="292" width="170" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="215" y="304" text-anchor="middle" dominant-baseline="central">Attention</text>
<text class="ts" x="215" y="322" text-anchor="middle" dominant-baseline="central">unchanged</text>
</g>
<g class="c-teal"><rect x="320" y="292" width="230" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="435" y="304" text-anchor="middle" dominant-baseline="central">MLP</text>
<text class="ts" x="435" y="322" text-anchor="middle" dominant-baseline="central">4 neurons edited</text>
</g>
<text class="ts" x="570" y="304" text-anchor="start" dominant-baseline="central">Title repair, neurons 792 and 1209, plus 244 and 1258</text>
<text class="ts" x="570" y="320" text-anchor="start" dominant-baseline="central">for Mayoress. They write the signal Mr and Mrs carry.</text>
<text class="ts" x="40" y="368" text-anchor="start" dominant-baseline="central">Layer 1</text>
<g class="box"><rect x="130" y="348" width="170" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="215" y="360" text-anchor="middle" dominant-baseline="central">Attention</text>
<text class="ts" x="215" y="378" text-anchor="middle" dominant-baseline="central">unchanged</text>
</g>
<g class="c-teal"><rect x="320" y="348" width="230" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="435" y="360" text-anchor="middle" dominant-baseline="central">MLP</text>
<text class="ts" x="435" y="378" text-anchor="middle" dominant-baseline="central">2 neurons edited</text>
</g>
<text class="ts" x="570" y="360" text-anchor="start" dominant-baseline="central">Title repair, neurons 54 and 485.</text>
<text class="ts" x="570" y="376" text-anchor="start" dominant-baseline="central">They detect Singapore titles such as Mstr and Madame.</text>
<text class="ts" x="40" y="424" text-anchor="start" dominant-baseline="central">Layer 0</text>
<g class="box"><rect x="130" y="404" width="170" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="215" y="416" text-anchor="middle" dominant-baseline="central">Attention</text>
<text class="ts" x="215" y="434" text-anchor="middle" dominant-baseline="central">unchanged</text>
</g>
<g class="box"><rect x="320" y="404" width="230" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="435" y="416" text-anchor="middle" dominant-baseline="central">MLP</text>
<text class="ts" x="435" y="434" text-anchor="middle" dominant-baseline="central">unchanged</text>
</g>
<g class="c-coral"><rect x="130" y="460" width="420" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="474" text-anchor="middle" dominant-baseline="central">Embeddings</text>
<text class="ts" x="340" y="492" text-anchor="middle" dominant-baseline="central">edits refused by save_edit</text>
</g>
<path d="M110 500 L110 70" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="40" y="532" text-anchor="start" dominant-baseline="central">In each edited MLP the edit rewrites those neurons' input weights, input biases and output weights, and shifts the layer's output bias</text>
<text class="ts" x="40" y="550" text-anchor="start" dominant-baseline="central">to cancel the neurons' old average output. 12 tensors and 7,304 numbers change. Every other number in MiniLM is unchanged.</text>
<g class="c-teal"><rect x="40" y="575" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="62" y="582" text-anchor="start" dominant-baseline="central">Edited in the submitted answer</text>
<g class="box"><rect x="300" y="575" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="322" y="582" text-anchor="start" dominant-baseline="central">Unchanged</text>
<g class="c-coral"><rect x="460" y="575" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="482" y="582" text-anchor="start" dominant-baseline="central">Edits not allowed</text>
<rect class="dr" x="640" y="575" width="14" height="14" rx="3" stroke-width="1"/>
<text class="ts" x="662" y="582" text-anchor="start" dominant-baseline="central">Tried during the run, not submitted</text>
</svg>
