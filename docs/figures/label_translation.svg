<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img">
<title>The gold spans are translated, not MiniLM</title>
<desc>The gold spans are the correct answers marked in the data. openpii's labels GIVENNAME, SURNAME, and TAXNUM are renamed to MiniLM's labels first_name, last_name, and national_id. MiniLM's 55 tag types never change. The scoring code compares MiniLM's tags with the renamed gold spans.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tl { font-size: 11px; fill: #5F5E5A; }
.mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; fill: #2C2C2A; }
.box rect { fill: #F1EFE8; stroke: #888780; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; } .c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
.c-coral rect, rect.c-coral { fill: #FAECE7; stroke: #993C1D; } .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
rect.sc { fill: #E1F5EE; stroke: #0F6E56; } text.sc { fill: #085041; font-weight: 500; }
rect.dr { fill: none; stroke: #888780; stroke-dasharray: 4 3; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
.card { fill: #FAFAF7; stroke: #E5E3DA; }
rect.tag { fill: #FBEAF0; stroke: #993556; }
.tv { font-size: 12px; font-weight: 500; fill: #2C2C2A; }
.ok { font-size: 12px; font-weight: 500; fill: #3B6D11; } .bad { font-size: 12px; font-weight: 500; fill: #A32D2D; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="960" height="360" fill="#FFFFFF"/>
<text class="ts" x="140" y="24" text-anchor="middle" dominant-baseline="central">openpii gold spans</text>
<text class="ts" x="440" y="24" text-anchor="middle" dominant-baseline="central">Gold spans in MiniLM's label names</text>
<text class="ts" x="780" y="24" text-anchor="middle" dominant-baseline="central">MiniLM's output</text>
<g class="box"><rect x="40" y="44" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="140" y="64" text-anchor="middle" dominant-baseline="central">GIVENNAME</text>
<text class="ts" x="140" y="82" text-anchor="middle" dominant-baseline="central">given names</text>
</g>
<path d="M242 72 L336 72" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="340" y="44" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="440" y="72" text-anchor="middle" dominant-baseline="central">first_name</text>
</g>
<g class="box"><rect x="40" y="116" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="140" y="136" text-anchor="middle" dominant-baseline="central">SURNAME</text>
<text class="ts" x="140" y="154" text-anchor="middle" dominant-baseline="central">surnames</text>
</g>
<path d="M242 144 L336 144" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="340" y="116" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="440" y="144" text-anchor="middle" dominant-baseline="central">last_name</text>
</g>
<g class="box"><rect x="40" y="188" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="140" y="208" text-anchor="middle" dominant-baseline="central">TAXNUM</text>
<text class="ts" x="140" y="226" text-anchor="middle" dominant-baseline="central">every value an NRIC</text>
</g>
<path d="M242 216 L336 216" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="340" y="188" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="440" y="216" text-anchor="middle" dominant-baseline="central">national_id</text>
</g>
<g class="box"><rect x="640" y="44" width="280" height="200" rx="8" stroke-width="0.5"/>
<text class="th" x="780" y="104" text-anchor="middle" dominant-baseline="central">MiniLM's tags</text>
<text class="ts" x="780" y="122" text-anchor="middle" dominant-baseline="central">55 types, such as first_name,</text>
<text class="ts" x="780" y="138" text-anchor="middle" dominant-baseline="central">national_id, and tax_id</text>
<text class="ts" x="780" y="154" text-anchor="middle" dominant-baseline="central"></text>
<text class="ts" x="780" y="170" text-anchor="middle" dominant-baseline="central">The types never change.</text>
<text class="ts" x="780" y="186" text-anchor="middle" dominant-baseline="central">Only the weights are edited.</text>
</g>
<path d="M440 246 L440 280" class="arr" marker-end="url(#arrow)"/>
<path d="M780 246 L780 280" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="340" y="282" width="580" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="630" y="302" text-anchor="middle" dominant-baseline="central">Scoring code</text>
<text class="ts" x="630" y="320" text-anchor="middle" dominant-baseline="central">A tag counts only if its words and its type match the gold spans.</text>
</g>
</svg>
