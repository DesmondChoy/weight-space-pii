<text class="tl last" x="490.3" y="524" text-anchor="middle" dominant-baseline="central">last_name, one span</text>
<text class="mono" x="190" y="502" dominant-baseline="central" textLength="452.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">full name (Dragos-Costin Keyfo Alhadeff Hachen), birthdate</text>
<text class="th" x="36" y="556" text-anchor="start" dominant-baseline="central">Model output</text>
<text class="ts" x="36" y="573" text-anchor="start" dominant-baseline="central">one entity per word</text>
<rect class="first" x="273.8" y="551" width="105.4" height="22" rx="4" stroke-width="1"/>
