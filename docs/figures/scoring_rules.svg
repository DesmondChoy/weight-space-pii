<text class="tl nric" x="529.3" y="794" text-anchor="middle" dominant-baseline="central">national_id, an NRIC</text>
<text class="mono" x="190" y="772" dominant-baseline="central" textLength="374.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">5. IDs: National ID XCN5487R2W, Tax ID T3215794T</text>
<text class="th" x="36" y="826" text-anchor="start" dominant-baseline="central">Model output</text>
<text class="ts" x="36" y="843" text-anchor="start" dominant-baseline="central">follows the words</text>
<rect class="nric" x="344" y="821" width="82" height="22" rx="4" stroke-width="1"/>
<text class="tl nric" x="385" y="854" text-anchor="middle" dominant-baseline="central">national_id</text>
<rect class="nric" x="492.2" y="821" width="74.2" height="22" rx="4" stroke-width="1"/>
<text class="tl nric" x="529.3" y="854" text-anchor="middle" dominant-baseline="central">tax_id</text>
<text class="mono" x="190" y="832" dominant-baseline="central" textLength="374.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">5. IDs: National ID XCN5487R2W, Tax ID T3215794T</text>
<text class="th" x="36" y="886" text-anchor="start" dominant-baseline="central">Grader scores</text>
<text class="ts" x="36" y="903" text-anchor="start" dominant-baseline="central">after rules 2 and 3</text>
<rect class="skip" x="344" y="881" width="82" height="22" rx="4" stroke-width="1" stroke-dasharray="4 3"/>
<text class="tl skip" x="385" y="914" text-anchor="middle" dominant-baseline="central">not counted, rule 3</text>
<rect class="nric" x="492.2" y="881" width="74.2" height="22" rx="4" stroke-width="1"/>
<text class="tl nric" x="529.3" y="914" text-anchor="middle" dominant-baseline="central">✓ national_id, rule 2</text>
<text class="mono" x="190" y="892" dominant-baseline="central" textLength="374.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">5. IDs: National ID XCN5487R2W, Tax ID T3215794T</text>
<text class="big ok" x="680" y="764" text-anchor="start" dominant-baseline="central">1 right, 0 false positives</text>
<text class="ts" x="680" y="784" text-anchor="start" dominant-baseline="central">with rules 2 and 3</text>
<text class="big bad" x="680" y="814" text-anchor="start" dominant-baseline="central">0 right, 1 false positive</text>
<text class="ts" x="680" y="834" text-anchor="start" dominant-baseline="central">read literally</text>
<text class="ts" x="680" y="866" text-anchor="start" dominant-baseline="central">Rule 2. The text says Tax ID, and the model</text>
<text class="ts" x="680" y="882" text-anchor="start" dominant-baseline="central">follows it. On practice, 134 of 159 NRICs</text>
<text class="ts" x="680" y="898" text-anchor="start" dominant-baseline="central">after "tax" are right, and 0 of the other 61.</text>
<text class="ts" x="680" y="922" text-anchor="start" dominant-baseline="central">Rule 3. M2 dropped ID card, passport and</text>
<text class="ts" x="680" y="938" text-anchor="start" dominant-baseline="central">licence numbers. A guess on one counts neither</text>
<text class="ts" x="680" y="954" text-anchor="start" dominant-baseline="central">way: national_id false positives, 65 to 5.</text>
<text class="th" x="20" y="1020" text-anchor="start" dominant-baseline="central">What each rule changes on the whole practice set</text>
<text class="ts" x="20" y="1038" text-anchor="start" dominant-baseline="central">Base model on all 1,000 practice rows. The predictions are the same in every bar. Only the scoring rules change.</text>
<text class="ts" x="36" y="1064" text-anchor="start" dominant-baseline="central">All three rules (the server)</text>
