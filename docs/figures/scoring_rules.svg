rect.skip { fill: #F1EFE8; stroke: #888780; } text.skip { fill: #5F5E5A; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="960" height="1160" fill="#FFFFFF"/>
<text class="h1" x="20" y="24" text-anchor="start" dominant-baseline="central">How the editor's grades are scored, and what the M4 prompt must tell it</text>
<text class="ts" x="20" y="48" text-anchor="start" dominant-baseline="central">M3 added three scoring rules. Every grade the editor gets applies them, so the task prompt has to state them.</text>
<text class="th" x="20" y="84" text-anchor="start" dominant-baseline="central">Where the rules live</text>
<text class="tc" x="400" y="84" text-anchor="start" dominant-baseline="central">Editor can see</text>
<text class="tr" x="780" y="84" text-anchor="start" dominant-baseline="central">Hidden from editor</text>
<g class="c-teal"><rect x="20" y="104" width="270" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="155" y="122" text-anchor="middle" dominant-baseline="central">§6 task prompt, filled in at M4</text>
<text class="ts" x="155" y="142" text-anchor="middle" dominant-baseline="central">Brief says: exact span and type</text>
<text class="ts" x="155" y="158" text-anchor="middle" dominant-baseline="central">M4 adds: rules 1, 2 and 3</text>
</g>
<g class="c-teal"><rect x="20" y="190" width="270" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="155" y="208" text-anchor="middle" dominant-baseline="central">Practice rows, sg_train.jsonl</text>
<text class="ts" x="155" y="228" text-anchor="middle" dominant-baseline="central">id, text, spans</text>
<text class="ts" x="155" y="244" text-anchor="middle" dominant-baseline="central">plus ignore spans, new in M3</text>
</g>
<g class="c-teal"><rect x="330" y="104" width="150" height="152" rx="8" stroke-width="0.5"/>
<text class="th" x="405" y="122" text-anchor="middle" dominant-baseline="central">Editor</text>
<text class="ts" x="405" y="142" text-anchor="middle" dominant-baseline="central">Opus 5.5</text>
<text class="ts" x="405" y="158" text-anchor="middle" dominant-baseline="central"></text>
<text class="ts" x="405" y="174" text-anchor="middle" dominant-baseline="central">reads the prompt,</text>
<text class="ts" x="405" y="190" text-anchor="middle" dominant-baseline="central">the rows and</text>
<text class="ts" x="405" y="206" text-anchor="middle" dominant-baseline="central">every grade</text>
</g>
<g class="box"><rect x="560" y="104" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="650" y="122" text-anchor="middle" dominant-baseline="central">Forward-pass server</text>
<text class="ts" x="650" y="142" text-anchor="middle" dominant-baseline="central">built in M4</text>
</g>
<g class="c-purple"><rect x="560" y="196" width="180" height="108" rx="8" stroke-width="0.5"/>
<text class="th" x="650" y="214" text-anchor="middle" dominant-baseline="central">wsp.score.grade</text>
<text class="ts" x="650" y="234" text-anchor="middle" dominant-baseline="central">1. Split names into words</text>
<text class="ts" x="650" y="250" text-anchor="middle" dominant-baseline="central">2. tax_id on an NRIC counts</text>
<text class="ts" x="650" y="266" text-anchor="middle" dominant-baseline="central">3. Drop guesses on ignore</text>
<text class="ts" x="650" y="282" text-anchor="middle" dominant-baseline="central">then exact span and type</text>
</g>
<g class="c-coral"><rect x="790" y="196" width="150" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="865" y="214" text-anchor="middle" dominant-baseline="central">M5 baseline</text>
<text class="ts" x="865" y="234" text-anchor="middle" dominant-baseline="central">main eval, Nemotron</text>
</g>
<g class="c-coral"><rect x="790" y="256" width="150" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="865" y="274" text-anchor="middle" dominant-baseline="central">M7 evaluation</text>
<text class="ts" x="865" y="294" text-anchor="middle" dominant-baseline="central">edited against base</text>
</g>
