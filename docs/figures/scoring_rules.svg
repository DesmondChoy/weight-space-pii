<circle cx="632" cy="177" r="10" class="badge"/>
<text class="bt" x="632" y="177" text-anchor="middle" dominant-baseline="central">C</text>
<text class="ts" x="60" y="336" text-anchor="start" dominant-baseline="central">The prompt must state rules 1 to 3. Without them, the grades the editor gets contradict the rule it was given.</text>
<text class="ts" x="60" y="360" text-anchor="start" dominant-baseline="central">The prompt must say that each practice row has an ignore list, and what a span in it means.</text>
<text class="ts" x="60" y="384" text-anchor="start" dominant-baseline="central">The server must call wsp.score.grade, not its own copy, so practice grades follow the same rules as M5 and M7.</text>
<circle cx="40" cy="336" r="10" class="badge"/>
<text class="bt" x="40" y="336" text-anchor="middle" dominant-baseline="central">A</text>
<circle cx="40" cy="360" r="10" class="badge"/>
<text class="bt" x="40" y="360" text-anchor="middle" dominant-baseline="central">B</text>
<circle cx="40" cy="384" r="10" class="badge"/>
<text class="bt" x="40" y="384" text-anchor="middle" dominant-baseline="central">C</text>
<rect x="20" y="420" width="920" height="250" rx="10" fill="#FAFAF7" stroke="#E5E3DA"/>
<text class="th" x="36" y="442" text-anchor="start" dominant-baseline="central">Rule 1. Each name is scored one word at a time</text>
<text class="ts" x="36" y="460" text-anchor="start" dominant-baseline="central">Practice row sg-24731778, which the editor can read</text>
<text class="th" x="36" y="496" text-anchor="start" dominant-baseline="central">In the file</text>
<text class="ts" x="36" y="513" text-anchor="start" dominant-baseline="central">openpii's spans</text>
<rect class="first" x="273.8" y="491" width="152.2" height="22" rx="4" stroke-width="1"/>
<text class="tl first" x="349.9" y="524" text-anchor="middle" dominant-baseline="central">first_name, one span</text>
