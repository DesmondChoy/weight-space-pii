<rect class="last" x="383" y="551" width="43" height="22" rx="4" stroke-width="1"/>
<text class="tl last" x="404.5" y="584" text-anchor="middle" dominant-baseline="central">last_name</text>
<rect class="last" x="429.8" y="551" width="66.4" height="22" rx="4" stroke-width="1"/>
<text class="tl last" x="463" y="584" text-anchor="middle" dominant-baseline="central">last_name</text>
<rect class="last" x="500" y="551" width="50.8" height="22" rx="4" stroke-width="1"/>
<text class="tl last" x="525.4" y="584" text-anchor="middle" dominant-baseline="central">last_name</text>
<text class="mono" x="190" y="562" dominant-baseline="central" textLength="452.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">full name (Dragos-Costin Keyfo Alhadeff Hachen), birthdate</text>
<text class="th" x="36" y="616" text-anchor="start" dominant-baseline="central">Grader scores</text>
<text class="ts" x="36" y="633" text-anchor="start" dominant-baseline="central">gold split into words</text>
<rect class="first" x="273.8" y="611" width="105.4" height="22" rx="4" stroke-width="1"/>
<text class="ok" x="326.5" y="644" text-anchor="middle" dominant-baseline="central">✓</text>
<rect class="first" x="383" y="611" width="43" height="22" rx="4" stroke-width="1"/>
<text class="bad" x="404.5" y="644" text-anchor="middle" dominant-baseline="central">✗</text>
<rect class="last" x="429.8" y="611" width="66.4" height="22" rx="4" stroke-width="1"/>
<text class="ok" x="463" y="644" text-anchor="middle" dominant-baseline="central">✓</text>
<rect class="last" x="500" y="611" width="50.8" height="22" rx="4" stroke-width="1"/>
<text class="ok" x="525.4" y="644" text-anchor="middle" dominant-baseline="central">✓</text>
<text class="mono" x="190" y="622" dominant-baseline="central" textLength="452.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">full name (Dragos-Costin Keyfo Alhadeff Hachen), birthdate</text>
<text class="big ok" x="680" y="494" text-anchor="start" dominant-baseline="central">3 of 4 right</text>
<text class="ts" x="680" y="514" text-anchor="start" dominant-baseline="central">with rule 1, which the server reports</text>
<text class="big bad" x="680" y="544" text-anchor="start" dominant-baseline="central">0 of 2 right</text>
<text class="ts" x="680" y="564" text-anchor="start" dominant-baseline="central">read literally: no whole name matches</text>
<text class="ts" x="680" y="596" text-anchor="start" dominant-baseline="central">The one real error is Keyfo, a given name</text>
<text class="ts" x="680" y="612" text-anchor="start" dominant-baseline="central">typed as last_name. Without rule 1, the</text>
<text class="ts" x="680" y="628" text-anchor="start" dominant-baseline="central">editor would chase openpii's B-I tags,</text>
<text class="ts" x="680" y="644" text-anchor="start" dominant-baseline="central">which the score doesn't reward.</text>
<rect x="20" y="690" width="920" height="300" rx="10" fill="#FAFAF7" stroke="#E5E3DA"/>
<text class="th" x="36" y="712" text-anchor="start" dominant-baseline="central">Rules 2 and 3. Two ID numbers in one row</text>
<text class="ts" x="36" y="730" text-anchor="start" dominant-baseline="central">Practice row sg-24844004. The row's ignore list holds the ID card number</text>
<text class="th" x="36" y="766" text-anchor="start" dominant-baseline="central">In the file</text>
<text class="ts" x="36" y="783" text-anchor="start" dominant-baseline="central">spans and ignore</text>
<rect class="skip" x="344" y="761" width="82" height="22" rx="4" stroke-width="1" stroke-dasharray="4 3"/>
<text class="tl skip" x="385" y="794" text-anchor="middle" dominant-baseline="central">ignore: IDCARDNUM</text>
