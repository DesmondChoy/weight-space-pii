<svg xmlns="http://www.w3.org/2000/svg" width="960" height="462" viewBox="0 0 960 462" role="img">
<title>When run p50 spent its forward passes, and how its context grew</title>
<desc>Run p50 lasted 232 turns. Its 50 forward passes ran MiniLM on three kinds of input: 18 on the dev half of the practice set, 10 on the held-back half, and 22 on texts Opus 5.5 wrote. The first edit was tested at turn 43, the final edit was first tested at turn 208, and the final answer came at turn 232. The context grew steadily to 780,000 tokens and never reached 967,000, where the CLI compacts the conversation.</desc>
