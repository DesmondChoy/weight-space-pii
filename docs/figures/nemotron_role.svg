<svg xmlns="http://www.w3.org/2000/svg" width="680" height="630" viewBox="0 0 680 630" role="img">
<title>Where Nemotron-PII fits</title>
<desc>The model's author merged Nemotron-PII train and test (200,000 rows) and re-split 90/10 with seed 42. The 180,000 training rows produced the base model. The 20,000 held-out rows give a 2,000-row regression sample that the editor never sees. That sample is used at M5 to confirm a Singapore gap and at M7 to check the edited model did not get worse on Nemotron.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.box { fill: #F1EFE8; stroke: #888780; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-coral rect { fill: #FAECE7; stroke: #993C1D; }
.c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="630" fill="#FFFFFF"/>

<rect class="box" x="190" y="40" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Nemotron-PII</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">train + test merged, 200,000 rows</text>

<path d="M340 96 L340 124 L170 124 L170 148" class="arr" marker-end="url(#arrow)"/>
<path d="M340 124 L510 124 L510 148" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="109" dominant-baseline="central">author's 90/10 split, seed 42</text>

<rect class="box" x="40" y="150" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="168" text-anchor="middle" dominant-baseline="central">Training rows</text>
<text class="ts" x="170" y="188" text-anchor="middle" dominant-baseline="central">180,000, base model fine-tuned</text>
<rect class="box" x="380" y="150" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="168" text-anchor="middle" dominant-baseline="central">Held-out split</text>
<text class="ts" x="510" y="188" text-anchor="middle" dominant-baseline="central">20,000 rows, 0 in training</text>

<line x1="170" y1="206" x2="170" y2="244" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="206" x2="510" y2="244" class="arr" marker-end="url(#arrow)"/>

<rect class="box" x="40" y="246" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="264" text-anchor="middle" dominant-baseline="central">Base model</text>
<text class="ts" x="170" y="284" text-anchor="middle" dominant-baseline="central">Home turf: US-style PII</text>
<g class="c-coral">
<rect x="380" y="246" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="264" text-anchor="middle" dominant-baseline="central">Regression sample</text>
<text class="ts" x="510" y="284" text-anchor="middle" dominant-baseline="central">2,000 rows, sampled at M3</text></g>

<line x1="170" y1="302" x2="170" y2="340" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="302" x2="510" y2="340" class="arr" marker-end="url(#arrow)"/>

<rect class="box" x="40" y="342" width="600" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="360" text-anchor="middle" dominant-baseline="central">Use 1, M5 gate: is there a Singapore gap?</text>
<text class="ts" x="340" y="380" text-anchor="middle" dominant-baseline="central">Base Nemotron F1 minus base Singapore F1 must exceed 2 bootstrap SE, or we stop</text>

<line x1="340" y1="398" x2="340" y2="436" class="arr" marker-end="url(#arrow)"/>

<rect class="box" x="230" y="438" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="456" text-anchor="middle" dominant-baseline="central">Editor run (M6)</text>
<text class="ts" x="340" y="476" text-anchor="middle" dominant-baseline="central">Never sees Nemotron</text>

<line x1="340" y1="494" x2="340" y2="532" class="arr" marker-end="url(#arrow)"/>
<path d="M640 274 L660 274 L660 562 L642 562" class="arr" marker-end="url(#arrow)"/>

<rect class="box" x="40" y="534" width="600" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="552" text-anchor="middle" dominant-baseline="central">Use 2, M7 check: did the edit break home turf?</text>
<text class="ts" x="340" y="572" text-anchor="middle" dominant-baseline="central">Paired F1 difference, edited minus base, with bootstrap SE, same 2,000 rows</text>
</svg>
