<svg xmlns="http://www.w3.org/2000/svg" width="960" height="358" viewBox="0 0 960 358" role="img">
<title>Singapore errors by kind and Nemotron F1 changes by label</title>
<desc>Left: errors on the Singapore main eval by kind, before and after the edit. False positives fall from 1,196 to 251, most of them titles no longer tagged as names. Wrong types fall from 610 to 339, mostly NRICs. Right: the Nemotron labels whose F1 changed most. national_id falls by 0.047 and biometric_identifier by 0.014, because biometric IDs shaped like a letter and 11 digits are now tagged national_id. Over all 55 labels, Nemotron F1 changes by -0.0004.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tl { font-size: 11px; fill: #5F5E5A; }
.mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; fill: #2C2C2A; }
.box rect { fill: #F1EFE8; stroke: #888780; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; } .c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
.c-coral rect, rect.c-coral { fill: #FAECE7; stroke: #993C1D; } .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
rect.sc { fill: #E1F5EE; stroke: #0F6E56; } text.sc { fill: #085041; font-weight: 500; }
rect.dr { fill: none; stroke: #888780; stroke-dasharray: 4 3; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
.card { fill: #FAFAF7; stroke: #E5E3DA; }
rect.tag { fill: #FBEAF0; stroke: #993556; }
.tv { font-size: 12px; font-weight: 500; fill: #2C2C2A; }
.ok { font-size: 12px; font-weight: 500; fill: #3B6D11; } .bad { font-size: 12px; font-weight: 500; fill: #A32D2D; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="960" height="358" fill="#FFFFFF"/>
<text class="th" x="40" y="22" text-anchor="start" dominant-baseline="central">Where the Singapore errors went, and what the edit cost on Nemotron</text>
<text class="ts" x="40" y="44" text-anchor="start" dominant-baseline="central">Left: errors on the Singapore main eval by kind. Right: the Nemotron labels whose F1 moved most, out of all 55.</text>
<text class="th" x="40" y="76" text-anchor="start" dominant-baseline="central">Singapore errors</text>
<text class="ts" x="40" y="111" text-anchor="start" dominant-baseline="central">False positive</text>
<g class="box"><rect x="170" y="96" width="249.167" height="14" rx="3" stroke-width="0.5"/></g>
<text class="tl" x="425.167" y="103" text-anchor="start" dominant-baseline="central">1,196</text>
<g class="c-teal"><rect x="170" y="112" width="52.2917" height="14" rx="3" stroke-width="0.5"/></g>
<text class="tl" x="228.292" y="119" text-anchor="start" dominant-baseline="central">251</text>
<text class="ts" x="40" y="153" text-anchor="start" dominant-baseline="central">Wrong type</text>
<g class="box"><rect x="170" y="138" width="127.083" height="14" rx="3" stroke-width="0.5"/></g>
<text class="tl" x="303.083" y="145" text-anchor="start" dominant-baseline="central">610</text>
<g class="c-teal"><rect x="170" y="154" width="70.625" height="14" rx="3" stroke-width="0.5"/></g>
<text class="tl" x="246.625" y="161" text-anchor="start" dominant-baseline="central">339</text>
<text class="ts" x="40" y="195" text-anchor="start" dominant-baseline="central">Missed</text>
<g class="box"><rect x="170" y="180" width="143.542" height="14" rx="3" stroke-width="0.5"/></g>
<text class="tl" x="319.542" y="187" text-anchor="start" dominant-baseline="central">689</text>
<g class="c-teal"><rect x="170" y="196" width="101.875" height="14" rx="3" stroke-width="0.5"/></g>
<text class="tl" x="277.875" y="203" text-anchor="start" dominant-baseline="central">489</text>
<text class="ts" x="40" y="237" text-anchor="start" dominant-baseline="central">Wrong boundary</text>
<g class="box"><rect x="170" y="222" width="128.958" height="14" rx="3" stroke-width="0.5"/></g>
<text class="tl" x="304.958" y="229" text-anchor="start" dominant-baseline="central">619</text>
<g class="c-teal"><rect x="170" y="238" width="105.833" height="14" rx="3" stroke-width="0.5"/></g>
<text class="tl" x="281.833" y="245" text-anchor="start" dominant-baseline="central">508</text>
<text class="tl" x="40" y="270" text-anchor="start" dominant-baseline="central">Titles tagged as a name fell from 909 to 2,</text>
<text class="tl" x="40" y="286" text-anchor="start" dominant-baseline="central">most of the drop in false positives.</text>
<text class="th" x="520" y="76" text-anchor="start" dominant-baseline="central">Nemotron F1 change, edited minus unedited</text>
<path d="M880 92 L880 276" stroke="#888780" stroke-width="1"/>
<text class="mono" x="520" y="108" text-anchor="start" dominant-baseline="central">national_id</text>
<g class="c-coral"><rect x="768.16" y="100" width="111.84" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tl" x="886" y="108" text-anchor="start" dominant-baseline="central">-0.047</text>
<text class="mono" x="520" y="138" text-anchor="start" dominant-baseline="central">biometric_identifier</text>
<g class="c-coral"><rect x="847.36" y="130" width="32.64" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tl" x="886" y="138" text-anchor="start" dominant-baseline="central">-0.014</text>
<text class="mono" x="520" y="168" text-anchor="start" dominant-baseline="central">certificate_license_number</text>
<g class="c-coral"><rect x="872.8" y="160" width="7.2" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tl" x="886" y="168" text-anchor="start" dominant-baseline="central">-0.003</text>
<text class="mono" x="520" y="198" text-anchor="start" dominant-baseline="central">vehicle_identifier</text>
<g class="c-coral"><rect x="874" y="190" width="6" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tl" x="886" y="198" text-anchor="start" dominant-baseline="central">-0.003</text>
<text class="mono" x="520" y="228" text-anchor="start" dominant-baseline="central">religious_belief</text>
<g class="c-teal"><rect x="880" y="220" width="5.04" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tl" x="891.04" y="228" text-anchor="start" dominant-baseline="central">+0.002</text>
<text class="mono" x="520" y="258" text-anchor="start" dominant-baseline="central">unique_id</text>
<g class="c-teal"><rect x="880" y="250" width="5.52" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tl" x="891.52" y="258" text-anchor="start" dominant-baseline="central">+0.002</text>
<text class="tl" x="520" y="290" text-anchor="start" dominant-baseline="central">35 biometric IDs shaped like a letter and 11 digits are now tagged national_id.</text>
<text class="tl" x="520" y="306" text-anchor="start" dominant-baseline="central">All 55 labels together: -0.0004 ± 0.0001, inside the prediction's 0.005.</text>
<g class="box"><rect x="40" y="329" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="62" y="336" text-anchor="start" dominant-baseline="central">Unedited MiniLM</text>
<g class="c-teal"><rect x="220" y="329" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="242" y="336" text-anchor="start" dominant-baseline="central">Edited MiniLM, or a gain</text>
<g class="c-coral"><rect x="440" y="329" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="462" y="336" text-anchor="start" dominant-baseline="central">A loss</text>
</svg>
