<svg xmlns="http://www.w3.org/2000/svg" width="960" height="318" viewBox="0 0 960 318" role="img">
<title>Where the edit rules are checked</title>
<desc>Opus 5.5's code saves an edit with save_edit, which checks it first. The edit goes to work/edited/. The forward-pass server checks every file there again before each forward pass and at the final answer, so code that writes a file directly and skips save_edit is still caught. Both checks refuse edits to the embeddings, edits to the classification head, and edits that one scale factor explains 99% or more of.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tl { font-size: 11px; fill: #5F5E5A; }
.mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; fill: #2C2C2A; }
.box rect { fill: #F1EFE8; stroke: #888780; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; } .c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
.c-coral rect, rect.c-coral { fill: #FAECE7; stroke: #993C1D; } .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
rect.sc { fill: #E1F5EE; stroke: #0F6E56; } text.sc { fill: #085041; font-weight: 500; }
rect.dr { fill: none; stroke: #888780; stroke-dasharray: 4 3; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
.card { fill: #FAFAF7; stroke: #E5E3DA; }
rect.tag { fill: #FBEAF0; stroke: #993556; }
.tv { font-size: 12px; font-weight: 500; fill: #2C2C2A; }
.ok { font-size: 12px; font-weight: 500; fill: #3B6D11; } .bad { font-size: 12px; font-weight: 500; fill: #A32D2D; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="960" height="318" fill="#FFFFFF"/>
<g class="box"><rect x="40" y="40" width="170" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="125" y="70" text-anchor="middle" dominant-baseline="central">Opus 5.5's code</text>
<text class="ts" x="125" y="88" text-anchor="middle" dominant-baseline="central">in the kernel</text>
</g>
<g class="c-purple"><rect x="270" y="40" width="190" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="365" y="62" text-anchor="middle" dominant-baseline="central">save_edit</text>
<text class="ts" x="365" y="80" text-anchor="middle" dominant-baseline="central">checks the edit first,</text>
<text class="ts" x="365" y="96" text-anchor="middle" dominant-baseline="central">refuses with a message</text>
</g>
<g class="c-teal"><rect x="520" y="40" width="150" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="595" y="70" text-anchor="middle" dominant-baseline="central">work/edited/</text>
<text class="ts" x="595" y="88" text-anchor="middle" dominant-baseline="central">one file per tensor</text>
</g>
<g class="c-purple"><rect x="730" y="40" width="190" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="825" y="62" text-anchor="middle" dominant-baseline="central">Server checks again</text>
<text class="ts" x="825" y="80" text-anchor="middle" dominant-baseline="central">before every forward pass</text>
<text class="ts" x="825" y="96" text-anchor="middle" dominant-baseline="central">and at the final answer</text>
</g>
<path d="M212 78 L268 78" class="arr" marker-end="url(#arrow)"/>
<path d="M462 78 L518 78" class="arr" marker-end="url(#arrow)"/>
<path d="M672 78 L728 78" class="arr" marker-end="url(#arrow)"/>
<path d="M125 118 L125 152 L595 152 L595 120" class="arr" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text class="tl" x="360" y="166" text-anchor="middle" dominant-baseline="central">code that writes a file directly skips save_edit, so the server catches it</text>
<text class="th" x="40" y="204" text-anchor="start" dominant-baseline="central">Both checks refuse the same three kinds of edit:</text>
<g class="c-coral"><rect x="40" y="222" width="280" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="180" y="252" text-anchor="middle" dominant-baseline="central">Embeddings</text>
<text class="ts" x="180" y="270" text-anchor="middle" dominant-baseline="central">any tensor named *embeddings*</text>
</g>
<g class="c-coral"><rect x="340" y="222" width="280" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="480" y="252" text-anchor="middle" dominant-baseline="central">Classification head</text>
<text class="ts" x="480" y="270" text-anchor="middle" dominant-baseline="central">classifier.weight, classifier.bias</text>
</g>
<g class="c-coral"><rect x="640" y="222" width="280" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="780" y="244" text-anchor="middle" dominant-baseline="central">Whole-tensor multiply</text>
<text class="ts" x="780" y="262" text-anchor="middle" dominant-baseline="central">one scale factor explains 99%</text>
<text class="ts" x="780" y="278" text-anchor="middle" dominant-baseline="central">or more of the change</text>
</g>
</svg>
