<svg xmlns="http://www.w3.org/2000/svg" width="960" height="384" viewBox="0 0 960 384" role="img">
<title>Two main-eval rows and their gold spans</title>
<desc>Two openpii rows with every gold span marked. Given names, surnames, and the NRIC are scored, renamed to MiniLM's labels first_name, last_name, and national_id. Titles, dates, cities, addresses, and the passport and ID card numbers are not scored.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tl { font-size: 11px; fill: #5F5E5A; }
.mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; fill: #2C2C2A; }
.box rect { fill: #F1EFE8; stroke: #888780; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; } .c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
.c-coral rect, rect.c-coral { fill: #FAECE7; stroke: #993C1D; } .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
rect.sc { fill: #E1F5EE; stroke: #0F6E56; } text.sc { fill: #085041; font-weight: 500; }
rect.dr { fill: none; stroke: #888780; stroke-dasharray: 4 3; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
.card { fill: #FAFAF7; stroke: #E5E3DA; }
rect.tag { fill: #FBEAF0; stroke: #993556; }
.tv { font-size: 12px; font-weight: 500; fill: #2C2C2A; }
.ok { font-size: 12px; font-weight: 500; fill: #3B6D11; } .bad { font-size: 12px; font-weight: 500; fill: #A32D2D; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="960" height="384" fill="#FFFFFF"/>
<text class="th" x="40" y="22" text-anchor="start" dominant-baseline="central">Row sg-24648387, shortened</text>
<rect class="dr" x="38" y="49" width="50.8" height="22" rx="4" stroke-width="1"/>
<text class="tl dr" x="47.9" y="84" text-anchor="start" dominant-baseline="central">TITLE</text>
<rect class="sc" x="92.6" y="49" width="89.8" height="22" rx="4" stroke-width="1"/>
<text class="tl sc" x="69.3" y="98" text-anchor="start" dominant-baseline="central">GIVENNAME → first_name</text>
<rect class="sc" x="186.2" y="49" width="50.8" height="22" rx="4" stroke-width="1"/>
<text class="tl sc" x="152.7" y="84" text-anchor="start" dominant-baseline="central">SURNAME → last_name</text>
<rect class="dr" x="373.4" y="49" width="152.2" height="22" rx="4" stroke-width="1"/>
<text class="tl dr" x="437.1" y="84" text-anchor="start" dominant-baseline="central">DATE</text>
<rect class="dr" x="584" y="49" width="74.2" height="22" rx="4" stroke-width="1"/>
<text class="tl dr" x="608.7" y="84" text-anchor="start" dominant-baseline="central">CITY</text>
<text class="mono" x="40" y="60" dominant-baseline="central" textLength="702" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Mister Enie Idilia Cibien, … scheduled for December 25th, 1944 at the Singapore Drop Zone.</text>
<rect class="dr" x="139.4" y="113" width="19.6" height="22" rx="4" stroke-width="1"/>
<text class="tl dr" x="115.1" y="148" text-anchor="start" dominant-baseline="central">BUILDINGNUM</text>
<rect class="dr" x="162.8" y="113" width="160" height="22" rx="4" stroke-width="1"/>
<text class="tl dr" x="224.2" y="148" text-anchor="start" dominant-baseline="central">STREET</text>
<rect class="dr" x="568.4" y="113" width="74.2" height="22" rx="4" stroke-width="1"/>
<text class="tl dr" x="571.4" y="148" text-anchor="start" dominant-baseline="central">PASSPORTNUM</text>
<rect class="dr" x="669.8" y="113" width="82" height="22" rx="4" stroke-width="1"/>
<text class="tl dr" x="682.9" y="148" text-anchor="start" dominant-baseline="central">IDCARDNUM</text>
<text class="mono" x="40" y="124" dominant-baseline="central" textLength="725.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">… located at 11 Lorong K Telok Kurau, … Please bring a copy of your OH1409941 or 598QI5X2NW …</text>
<text class="th" x="40" y="196" text-anchor="start" dominant-baseline="central">Row sg-24831906</text>
<rect class="sc" x="225.2" y="223" width="97.6" height="22" rx="4" stroke-width="1"/>
<text class="tl sc" x="205.8" y="258" text-anchor="start" dominant-baseline="central">GIVENNAME → first_name</text>
<rect class="sc" x="326.6" y="223" width="58.6" height="22" rx="4" stroke-width="1"/>
<text class="tl sc" x="297" y="272" text-anchor="start" dominant-baseline="central">SURNAME → last_name</text>
<text class="mono" x="40" y="234" dominant-baseline="central" textLength="444.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Our compliance officer, Deyancho Amr Kayoumi, will review</text>
<rect class="sc" x="209.6" y="287" width="74.2" height="22" rx="4" stroke-width="1"/>
<text class="tl sc" x="184.7" y="322" text-anchor="start" dominant-baseline="central">TAXNUM → national_id</text>
<text class="mono" x="40" y="298" dominant-baseline="central" textLength="460.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">the tax details under G6346291N during the quarterly audit.</text>
<rect class="sc" x="40" y="355" width="14" height="14" rx="3" stroke-width="1"/>
<text class="ts" x="62" y="362" text-anchor="start" dominant-baseline="central">Scored. openpii's label → MiniLM's label</text>
<rect class="dr" x="370" y="355" width="14" height="14" rx="3" stroke-width="1"/>
<text class="ts" x="392" y="362" text-anchor="start" dominant-baseline="central">Not scored. openpii's label</text>
</svg>
