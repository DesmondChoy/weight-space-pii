<svg xmlns="http://www.w3.org/2000/svg" width="960" height="372" viewBox="0 0 960 372" role="img">
<title>Baseline F1 of the unedited MiniLM by scored label</title>
<desc>F1 of the unedited MiniLM, measured in M5, on each scored label, Singapore test set against Nemotron held-out test set. first_name 0.580 against 0.985, last_name 0.743 against 0.984, national_id 0.737 against 0.959. Pooled over the three labels, which is what the gate compares, Singapore scores 0.674 and Nemotron 0.984, a gap of 0.310, far above the gate's threshold of 0.0087.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tl { font-size: 11px; fill: #5F5E5A; }
.mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; fill: #2C2C2A; }
.box rect { fill: #F1EFE8; stroke: #888780; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; } .c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
.c-coral rect, rect.c-coral { fill: #FAECE7; stroke: #993C1D; } .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
rect.sc { fill: #E1F5EE; stroke: #0F6E56; } text.sc { fill: #085041; font-weight: 500; }
rect.dr { fill: none; stroke: #888780; stroke-dasharray: 4 3; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
.card { fill: #FAFAF7; stroke: #E5E3DA; }
rect.tag { fill: #FBEAF0; stroke: #993556; }
.tv { font-size: 12px; font-weight: 500; fill: #2C2C2A; }
.ok { font-size: 12px; font-weight: 500; fill: #3B6D11; } .bad { font-size: 12px; font-weight: 500; fill: #A32D2D; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="960" height="372" fill="#FFFFFF"/>
<text class="th" x="40" y="22" text-anchor="start" dominant-baseline="central">Baseline: F1 of the unedited MiniLM on each scored label</text>
<text class="ts" x="40" y="44" text-anchor="start" dominant-baseline="central">Measured in M5, before any edit. Each pair compares Singapore test text with test text like MiniLM's own training data.</text>
<g class="c-coral"><rect x="40" y="67" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="62" y="74" text-anchor="start" dominant-baseline="central">Singapore test set (main eval), 5,004 rows</text>
<g class="box"><rect x="400" y="67" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="422" y="74" text-anchor="start" dominant-baseline="central">Nemotron held-out test set, 18,515 rows</text>
<text class="mono" x="40" y="108" text-anchor="start" dominant-baseline="central">first_name</text>
<text class="tl" x="40" y="126" text-anchor="start" dominant-baseline="central">6,244 Singapore entities</text>
<g class="c-coral"><rect x="330" y="100" width="301.392" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="639.392" y="108" text-anchor="start" dominant-baseline="central">0.580</text>
<g class="box"><rect x="330" y="120" width="512.044" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="850.044" y="128" text-anchor="start" dominant-baseline="central">0.985</text>
<text class="mono" x="40" y="160" text-anchor="start" dominant-baseline="central">last_name</text>
<text class="tl" x="40" y="178" text-anchor="start" dominant-baseline="central">5,696 Singapore entities</text>
<g class="c-coral"><rect x="330" y="152" width="386.412" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="724.412" y="160" text-anchor="start" dominant-baseline="central">0.743</text>
<g class="box"><rect x="330" y="172" width="511.42" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="849.42" y="180" text-anchor="start" dominant-baseline="central">0.984</text>
<text class="mono" x="40" y="212" text-anchor="start" dominant-baseline="central">national_id</text>
<text class="tl" x="40" y="230" text-anchor="start" dominant-baseline="central">1,034 Singapore entities</text>
<g class="c-coral"><rect x="330" y="204" width="383.448" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="721.448" y="212" text-anchor="start" dominant-baseline="central">0.737</text>
<g class="box"><rect x="330" y="224" width="498.68" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="836.68" y="232" text-anchor="start" dominant-baseline="central">0.959</text>
<path d="M40 258 L900 258" stroke="#E5E3DA" stroke-width="1"/>
<text class="th" x="40" y="278" text-anchor="start" dominant-baseline="central">All three, pooled</text>
<text class="tl" x="40" y="296" text-anchor="start" dominant-baseline="central">the gate compares these two</text>
<g class="c-coral"><rect x="330" y="270" width="350.48" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="688.48" y="278" text-anchor="start" dominant-baseline="central">0.674</text>
<g class="box"><rect x="330" y="290" width="511.472" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="849.472" y="298" text-anchor="start" dominant-baseline="central">0.984</text>
<text class="ts" x="40" y="332" text-anchor="start" dominant-baseline="central">Pooled F1 counts every entity together, so first_name, with the most entities, pulls it below the mean of the three, 0.687.</text>
<text class="ts" x="40" y="350" text-anchor="start" dominant-baseline="central">Gap 0.310. The gate needs more than twice its standard error, 2 × 0.0044 = 0.0087. It passes.</text>
</svg>
