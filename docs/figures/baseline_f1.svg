<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img">
<title>Baseline F1 of the unedited MiniLM by scored label</title>
<desc>F1 of the unedited MiniLM, measured in M5, on each scored label, Singapore test set against Nemotron held-out test set. On Singapore text given names and surnames are scored as one label, name: name 0.874 against 0.989, national_id 0.737 against 0.959. With both labels counted together, which is what the check that there is something to repair compares, Singapore scores 0.865 and Nemotron 0.988, a gap of 0.123, far above the check's threshold of 0.0060. The check passes.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tl { font-size: 11px; fill: #5F5E5A; }
.mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; fill: #2C2C2A; }
.box rect { fill: #F1EFE8; stroke: #888780; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; } .c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
.c-coral rect, rect.c-coral { fill: #FAECE7; stroke: #993C1D; } .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
rect.sc { fill: #E1F5EE; stroke: #0F6E56; } text.sc { fill: #085041; font-weight: 500; }
rect.dr { fill: none; stroke: #888780; stroke-dasharray: 4 3; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
.card { fill: #FAFAF7; stroke: #E5E3DA; }
rect.tag { fill: #FBEAF0; stroke: #993556; }
.tv { font-size: 12px; font-weight: 500; fill: #2C2C2A; }
.ok { font-size: 12px; font-weight: 500; fill: #3B6D11; } .bad { font-size: 12px; font-weight: 500; fill: #A32D2D; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="960" height="320" fill="#FFFFFF"/>
<text class="th" x="40" y="22" text-anchor="start" dominant-baseline="central">Baseline: F1 of the unedited MiniLM on each scored label</text>
<text class="ts" x="40" y="44" text-anchor="start" dominant-baseline="central">Measured in M5, before any edit. Each pair compares Singapore test text with test text like MiniLM's own training data.</text>
<g class="c-coral"><rect x="40" y="67" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="62" y="74" text-anchor="start" dominant-baseline="central">Singapore test set (main eval), 5,004 rows</text>
<g class="box"><rect x="400" y="67" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="422" y="74" text-anchor="start" dominant-baseline="central">Nemotron held-out test set, 18,515 rows</text>
<text class="mono" x="40" y="108" text-anchor="start" dominant-baseline="central">name</text>
<text class="tl" x="40" y="126" text-anchor="start" dominant-baseline="central">given names and surnames, 11,940 Singapore entities</text>
<g class="c-coral"><rect x="330" y="100" width="454.428" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="792.428" y="108" text-anchor="start" dominant-baseline="central">0.874</text>
<g class="box"><rect x="330" y="120" width="514.228" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="852.228" y="128" text-anchor="start" dominant-baseline="central">0.989</text>
<text class="mono" x="40" y="160" text-anchor="start" dominant-baseline="central">national_id</text>
<text class="tl" x="40" y="178" text-anchor="start" dominant-baseline="central">1,034 Singapore entities</text>
<g class="c-coral"><rect x="330" y="152" width="383.448" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="721.448" y="160" text-anchor="start" dominant-baseline="central">0.737</text>
<g class="box"><rect x="330" y="172" width="498.68" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="836.68" y="180" text-anchor="start" dominant-baseline="central">0.959</text>
<path d="M40 206 L900 206" stroke="#E5E3DA" stroke-width="1"/>
<text class="th" x="40" y="222" text-anchor="start" dominant-baseline="central">Both labels counted together</text>
<text class="tl" x="40" y="240" text-anchor="start" dominant-baseline="central">used by the check that there</text>
<text class="tl" x="40" y="254" text-anchor="start" dominant-baseline="central">is something to repair</text>
<g class="c-coral"><rect x="330" y="218" width="449.748" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="787.748" y="226" text-anchor="start" dominant-baseline="central">0.865</text>
<g class="box"><rect x="330" y="238" width="513.864" height="16" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="851.864" y="246" text-anchor="start" dominant-baseline="central">0.988</text>
<text class="ts" x="40" y="280" text-anchor="start" dominant-baseline="central">Counted together, every entity counts once. Names are 92% of the entities, so they pull F1 above the mean of the two labels, 0.806.</text>
<text class="ts" x="40" y="298" text-anchor="start" dominant-baseline="central">Gap 0.123. The check that there is something to repair needs more than twice its standard error, 2 × 0.0030 = 0.0060. The check passes.</text>
</svg>
