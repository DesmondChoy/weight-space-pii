<text class="ts" x="40" y="44" text-anchor="start" dominant-baseline="central">Main eval, 5,004 rows. Each pair is the share of one category's entities tagged with the exact span and the right label.</text>
<text class="ts" x="40" y="62" text-anchor="start" dominant-baseline="central">Fixed means a rise of at least 10 points. The last two columns give the M5 prediction and the result under that rule.</text>
