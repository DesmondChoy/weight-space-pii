<text class="th" x="40" y="462" text-anchor="start" dominant-baseline="central">Same workflow as the paper's Experiment 8, where Astra ran through the Codex CLI with its tools off.</text>
<text class="ts" x="40" y="482" text-anchor="start" dominant-baseline="central">The paper did not publish its harness code, so this code is our rebuild of that workflow.</text>
