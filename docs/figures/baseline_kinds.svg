<text class="ts" x="56" y="352" text-anchor="start" dominant-baseline="central">Surname of one word (2,688)</text>
<rect x="390" y="342" width="480" height="20" rx="3" fill="#FAFAF7" stroke="#E5E3DA" stroke-width="0.5"/>
<g class="box"><rect x="390" y="342" width="443.04" height="20" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="880" y="352" text-anchor="start" dominant-baseline="central">92%</text>
<text class="ts" x="56" y="382" text-anchor="start" dominant-baseline="central">Surname of several words, first word (1,274)</text>
<rect x="390" y="372" width="480" height="20" rx="3" fill="#FAFAF7" stroke="#E5E3DA" stroke-width="0.5"/>
<g class="box"><rect x="390" y="372" width="417.072" height="20" rx="3" stroke-width="0.5"/></g>
