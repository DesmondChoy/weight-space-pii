<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img">
<title>Baseline share right by category of Singapore entity</title>
<desc>The share of entities the unedited MiniLM tags with the exact span and the right label on the Singapore test set, the main eval, split by category. Given names and surnames are scored as one label, name. Just before means within the 60 characters before the number. The category "NRIC without "tax" just before it" is 0% right, most tagged biometric_identifier or missed, and is the one category predicted to be fixed. The other categories are 83% to 92% right.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tl { font-size: 11px; fill: #5F5E5A; }
.mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; fill: #2C2C2A; }
.box rect { fill: #F1EFE8; stroke: #888780; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; } .c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
.c-coral rect, rect.c-coral { fill: #FAECE7; stroke: #993C1D; } .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
rect.sc { fill: #E1F5EE; stroke: #0F6E56; } text.sc { fill: #085041; font-weight: 500; }
rect.dr { fill: none; stroke: #888780; stroke-dasharray: 4 3; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
.card { fill: #FAFAF7; stroke: #E5E3DA; }
rect.tag { fill: #FBEAF0; stroke: #993556; }
.tv { font-size: 12px; font-weight: 500; fill: #2C2C2A; }
.ok { font-size: 12px; font-weight: 500; fill: #3B6D11; } .bad { font-size: 12px; font-weight: 500; fill: #A32D2D; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="960" height="470" fill="#FFFFFF"/>
<text class="th" x="40" y="22" text-anchor="start" dominant-baseline="central">Baseline: which Singapore entities the unedited MiniLM gets right, by category</text>
<text class="ts" x="40" y="44" text-anchor="start" dominant-baseline="central">Singapore test set (the main eval, 5,004 rows). Each bar is the share of one category's entities that MiniLM tags exactly right.</text>
<text class="ts" x="40" y="62" text-anchor="start" dominant-baseline="central">Given names and surnames are scored as one label, name. One category is almost never right, and the prediction says the edit will fix it.</text>
<text class="ts" x="40" y="80" text-anchor="start" dominant-baseline="central">"Just before" means within the 60 characters before the number, about ten words.</text>
<text class="mono" x="40" y="112" text-anchor="start" dominant-baseline="central">national_id</text>
<text class="ts" x="56" y="138" text-anchor="start" dominant-baseline="central">NRIC without "tax" just before it (323)</text>
<rect x="390" y="128" width="480" height="20" rx="3" fill="#FAFAF7" stroke="#0F6E56" stroke-width="1"/>
<text class="tl" x="400" y="138" text-anchor="start" dominant-baseline="central">most tagged biometric_identifier (168) or missed (118)</text>
<text class="tv" x="880" y="138" text-anchor="start" dominant-baseline="central">0%</text>
<text class="ts" x="56" y="168" text-anchor="start" dominant-baseline="central">NRIC with "tax" just before it (711)</text>
<rect x="390" y="158" width="480" height="20" rx="3" fill="#FAFAF7" stroke="#E5E3DA" stroke-width="0.5"/>
<g class="box"><rect x="390" y="158" width="419.904" height="20" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="880" y="168" text-anchor="start" dominant-baseline="central">87%</text>
<text class="mono" x="40" y="204" text-anchor="start" dominant-baseline="central">name, given names</text>
<text class="ts" x="56" y="230" text-anchor="start" dominant-baseline="central">Given name of one word (3,376)</text>
<rect x="390" y="220" width="480" height="20" rx="3" fill="#FAFAF7" stroke="#E5E3DA" stroke-width="0.5"/>
<g class="box"><rect x="390" y="220" width="405.648" height="20" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="880" y="230" text-anchor="start" dominant-baseline="central">85%</text>
<text class="ts" x="56" y="260" text-anchor="start" dominant-baseline="central">Given name of several words, first word (1,434)</text>
