<rect x="390" y="280" width="480" height="20" rx="3" fill="#FAFAF7" stroke="#E5E3DA" stroke-width="0.5"/>
<g class="box"><rect x="390" y="280" width="435.504" height="20" rx="3" stroke-width="0.5"/></g>
