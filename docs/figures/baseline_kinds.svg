<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452" role="img">
<title>Baseline share right by kind of Singapore entity</title>
<desc>The share of entities the unedited MiniLM tags with the exact span and the right label on the Singapore test set, the main eval, split by kind and grouped by scored label. NRICs without tax context are 0% right, most tagged biometric_identifier or missed, and are the one kind predicted to be fixed. Later words of given names are 5% right, 1,227 of 1,434 tagged last_name. The other kinds are 62% to 89% right.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tl { font-size: 11px; fill: #5F5E5A; }
.mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; fill: #2C2C2A; }
.box rect { fill: #F1EFE8; stroke: #888780; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; } .c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
.c-coral rect, rect.c-coral { fill: #FAECE7; stroke: #993C1D; } .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
rect.sc { fill: #E1F5EE; stroke: #0F6E56; } text.sc { fill: #085041; font-weight: 500; }
rect.dr { fill: none; stroke: #888780; stroke-dasharray: 4 3; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
.card { fill: #FAFAF7; stroke: #E5E3DA; }
rect.tag { fill: #FBEAF0; stroke: #993556; }
.tv { font-size: 12px; font-weight: 500; fill: #2C2C2A; }
.ok { font-size: 12px; font-weight: 500; fill: #3B6D11; } .bad { font-size: 12px; font-weight: 500; fill: #A32D2D; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="960" height="452" fill="#FFFFFF"/>
<text class="th" x="40" y="22" text-anchor="start" dominant-baseline="central">Baseline: which Singapore entities the unedited MiniLM gets right, by kind</text>
<text class="ts" x="40" y="44" text-anchor="start" dominant-baseline="central">Singapore test set (the main eval, 5,004 rows). Each bar is the share of one kind's entities that MiniLM tags exactly right.</text>
<text class="ts" x="40" y="62" text-anchor="start" dominant-baseline="central">The misses are not spread evenly: two kinds are almost never right. The prediction says which kinds the edit will fix.</text>
<text class="mono" x="40" y="94" text-anchor="start" dominant-baseline="central">national_id</text>
<text class="ts" x="56" y="120" text-anchor="start" dominant-baseline="central">NRIC, no tax context (323)</text>
<rect x="330" y="110" width="520" height="20" rx="3" fill="#FAFAF7" stroke="#0F6E56" stroke-width="1"/>
<text class="tl" x="340" y="120" text-anchor="start" dominant-baseline="central">most tagged biometric_identifier (168) or missed (118)</text>
<text class="tv" x="860" y="120" text-anchor="start" dominant-baseline="central">0%</text>
<text class="ts" x="56" y="150" text-anchor="start" dominant-baseline="central">NRIC, tax context (711)</text>
<rect x="330" y="140" width="520" height="20" rx="3" fill="#FAFAF7" stroke="#E5E3DA" stroke-width="0.5"/>
<g class="box"><rect x="330" y="140" width="454.896" height="20" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="860" y="150" text-anchor="start" dominant-baseline="central">87%</text>
<text class="mono" x="40" y="186" text-anchor="start" dominant-baseline="central">first_name</text>
<text class="ts" x="56" y="212" text-anchor="start" dominant-baseline="central">Given name, several words, later word (1,434)</text>
<rect x="330" y="202" width="520" height="20" rx="3" fill="#FAFAF7" stroke="#E5E3DA" stroke-width="0.5"/>
<g class="box"><rect x="330" y="202" width="26.832" height="20" rx="3" stroke-width="0.5"/></g>
<text class="tl" x="366.832" y="212" text-anchor="start" dominant-baseline="central">1,227 of 1,434 tagged last_name</text>
<text class="tv" x="860" y="212" text-anchor="start" dominant-baseline="central">5%</text>
<text class="ts" x="56" y="242" text-anchor="start" dominant-baseline="central">Given name, one word (3,376)</text>
