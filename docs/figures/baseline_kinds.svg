<svg xmlns="http://www.w3.org/2000/svg" width="960" height="474" viewBox="0 0 960 474" role="img">
<title>Where the unedited MiniLM fails</title>
<desc>Top: on the three scored labels, MiniLM scores F1 0.674 on the Singapore main eval and 0.984 on Nemotron, a gap of 0.310, far above the gate's threshold of 0.0087. Bottom: the share of entities right on the main eval for each kind. NRICs without tax context are 0% right and are the one kind predicted to be fixed. Later words of given names are 5% right. The other kinds are 62% to 89% right.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tl { font-size: 11px; fill: #5F5E5A; }
.mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; fill: #2C2C2A; }
.box rect { fill: #F1EFE8; stroke: #888780; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; } .c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
.c-coral rect, rect.c-coral { fill: #FAECE7; stroke: #993C1D; } .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
rect.sc { fill: #E1F5EE; stroke: #0F6E56; } text.sc { fill: #085041; font-weight: 500; }
rect.dr { fill: none; stroke: #888780; stroke-dasharray: 4 3; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
.card { fill: #FAFAF7; stroke: #E5E3DA; }
rect.tag { fill: #FBEAF0; stroke: #993556; }
.tv { font-size: 12px; font-weight: 500; fill: #2C2C2A; }
.ok { font-size: 12px; font-weight: 500; fill: #3B6D11; } .bad { font-size: 12px; font-weight: 500; fill: #A32D2D; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="960" height="474" fill="#FFFFFF"/>
<text class="th" x="40" y="22" text-anchor="start" dominant-baseline="central">The gate: F1 on the three scored labels</text>
<text class="ts" x="40" y="59" text-anchor="start" dominant-baseline="central">Singapore main eval, 5,004 rows</text>
<g class="c-coral"><rect x="330" y="48" width="350.48" height="22" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="688.48" y="59" text-anchor="start" dominant-baseline="central">0.674</text>
<text class="ts" x="40" y="93" text-anchor="start" dominant-baseline="central">Nemotron held-out, 18,515 rows</text>
<g class="box"><rect x="330" y="82" width="511.68" height="22" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="849.68" y="93" text-anchor="start" dominant-baseline="central">0.984</text>
<text class="ts" x="40" y="130" text-anchor="start" dominant-baseline="central">Gap 0.310. The gate needs more than twice its standard error, 2 × 0.0044 = 0.0087. It passes.</text>
<text class="th" x="40" y="176" text-anchor="start" dominant-baseline="central">Share of entities MiniLM gets right on the main eval, by kind</text>
<text class="ts" x="40" y="206" text-anchor="start" dominant-baseline="central">NRIC, no tax context (323)</text>
<rect x="330" y="196" width="520" height="20" rx="3" fill="#FAFAF7" stroke="#0F6E56" stroke-width="1"/>
<text class="tv" x="860" y="206" text-anchor="start" dominant-baseline="central">0%</text>
<text class="ts" x="40" y="236" text-anchor="start" dominant-baseline="central">NRIC, tax context (711)</text>
<rect x="330" y="226" width="520" height="20" rx="3" fill="#FAFAF7" stroke="#E5E3DA" stroke-width="0.5"/>
<g class="box"><rect x="330" y="226" width="454.896" height="20" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="860" y="236" text-anchor="start" dominant-baseline="central">87%</text>
<text class="ts" x="40" y="266" text-anchor="start" dominant-baseline="central">Given name, several words, later word (1,434)</text>
<rect x="330" y="256" width="520" height="20" rx="3" fill="#FAFAF7" stroke="#E5E3DA" stroke-width="0.5"/>
<g class="box"><rect x="330" y="256" width="26.832" height="20" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="860" y="266" text-anchor="start" dominant-baseline="central">5%</text>
