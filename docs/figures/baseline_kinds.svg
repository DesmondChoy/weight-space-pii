<text class="ts" x="56" y="334" text-anchor="start" dominant-baseline="central">Surname, one word (2,688)</text>
<rect x="330" y="324" width="520" height="20" rx="3" fill="#FAFAF7" stroke="#E5E3DA" stroke-width="0.5"/>
<g class="box"><rect x="330" y="324" width="465.036" height="20" rx="3" stroke-width="0.5"/></g>
