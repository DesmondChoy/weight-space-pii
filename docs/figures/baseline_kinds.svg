<rect x="330" y="286" width="520" height="20" rx="3" fill="#FAFAF7" stroke="#E5E3DA" stroke-width="0.5"/>
<g class="box"><rect x="330" y="286" width="321.464" height="20" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="860" y="296" text-anchor="start" dominant-baseline="central">62%</text>
<text class="ts" x="40" y="326" text-anchor="start" dominant-baseline="central">Given name, several words, first word (1,434)</text>
<rect x="330" y="316" width="520" height="20" rx="3" fill="#FAFAF7" stroke="#E5E3DA" stroke-width="0.5"/>
<g class="box"><rect x="330" y="316" width="346.684" height="20" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="860" y="326" text-anchor="start" dominant-baseline="central">67%</text>
<text class="ts" x="40" y="356" text-anchor="start" dominant-baseline="central">Surname, one word (2,688)</text>
<rect x="330" y="346" width="520" height="20" rx="3" fill="#FAFAF7" stroke="#E5E3DA" stroke-width="0.5"/>
<g class="box"><rect x="330" y="346" width="465.036" height="20" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="860" y="356" text-anchor="start" dominant-baseline="central">89%</text>
<text class="ts" x="40" y="386" text-anchor="start" dominant-baseline="central">Surname, several words, first word (1,274)</text>
<rect x="330" y="376" width="520" height="20" rx="3" fill="#FAFAF7" stroke="#E5E3DA" stroke-width="0.5"/>
<g class="box"><rect x="330" y="376" width="422.448" height="20" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="860" y="386" text-anchor="start" dominant-baseline="central">81%</text>
<text class="ts" x="40" y="416" text-anchor="start" dominant-baseline="central">Surname, several words, later word (1,734)</text>
<rect x="330" y="406" width="520" height="20" rx="3" fill="#FAFAF7" stroke="#E5E3DA" stroke-width="0.5"/>
<g class="box"><rect x="330" y="406" width="430.924" height="20" rx="3" stroke-width="0.5"/></g>
<text class="tv" x="860" y="416" text-anchor="start" dominant-baseline="central">83%</text>
<g class="c-teal"><rect x="40" y="445" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="62" y="452" text-anchor="start" dominant-baseline="central">Predicted fixed by the edit</text>
<g class="box"><rect x="280" y="445" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="302" y="452" text-anchor="start" dominant-baseline="central">Predicted unchanged</text>
</svg>
