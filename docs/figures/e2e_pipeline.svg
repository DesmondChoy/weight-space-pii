<g class="c-purple">
<rect x="745" y="276" width="195" height="168" rx="8" stroke-width="0.5"/>
<text class="th" x="842.5" y="294" text-anchor="middle" dominant-baseline="central">Scoring protocol</text>
<text class="ts" x="842.5" y="314" text-anchor="middle" dominant-baseline="central">1. Tokenize, max 512</text>
<text class="ts" x="842.5" y="330" text-anchor="middle" dominant-baseline="central">2. Argmax, first subtoken</text>
<text class="ts" x="842.5" y="346" text-anchor="middle" dominant-baseline="central">3. BIO repair, word spans</text>
<text class="ts" x="842.5" y="362" text-anchor="middle" dominant-baseline="central">4. Split names into words</text>
<text class="ts" x="842.5" y="378" text-anchor="middle" dominant-baseline="central">5. Match gold: exact span + type</text>
<text class="ts" x="842.5" y="394" text-anchor="middle" dominant-baseline="central">Score: strict micro F1,</text>
<text class="ts" x="842.5" y="410" text-anchor="middle" dominant-baseline="central">precision, recall,</text>
<text class="ts" x="842.5" y="426" text-anchor="middle" dominant-baseline="central">per-category F1</text>
</g>
<path d="M220 390 L220 492" class="arr" marker-end="url(#arrow)"/>
