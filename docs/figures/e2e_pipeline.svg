<g class="c-teal">
<rect x="125" y="16" width="190" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="220" y="34" text-anchor="middle" dominant-baseline="central">Practice</text>
<text class="ts" x="220" y="54" text-anchor="middle" dominant-baseline="central">editor sees</text>
</g>
