<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1564" viewBox="0 0 960 1564" role="img">
<title>End-to-end weight-space PII experiment</title>
<desc>Swimlane diagram. Rows are milestones M1 to M8. Columns are the practice set the editor sees, the hidden Singapore main eval, the hidden Nemotron regression set, and a lane for scoring and comparisons. Data is downloaded and split at M1, sampled and relabelled at M3 where the scoring protocol is fixed, checked at M4, frozen and scored for the base model at M5 with the C1 gate, edited at M6, scored for the edited model at M7 with comparisons C2 to C4, and written up at M8 with comparison C5.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.box { fill: #F1EFE8; stroke: #888780; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
.c-coral rect, rect.c-coral { fill: #FAECE7; stroke: #993C1D; }
.c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
.c-purple rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; }
.c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="960" height="1564" fill="#FFFFFF"/>
<text class="th" x="24" y="26" text-anchor="start" dominant-baseline="central">Milestones. Each one ends with a stop for review before the next starts.</text>
<text class="th" x="24" y="56" text-anchor="start" dominant-baseline="central">M1 Environment</text>
<text class="ts" x="24" y="74" text-anchor="start" dominant-baseline="central">Pin the Python env, download model and data, sign in the editor</text>
<text class="th" x="24" y="98" text-anchor="start" dominant-baseline="central">M2 Profile</text>
<text class="ts" x="24" y="116" text-anchor="start" dominant-baseline="central">Profile the Singapore rows, propose sample sizes and scored labels</text>
<text class="th" x="24" y="140" text-anchor="start" dominant-baseline="central">M3 Sample and metric</text>
<text class="ts" x="24" y="158" text-anchor="start" dominant-baseline="central">Draw the seeded practice sample, relabel, write and test the scorer</text>
<text class="th" x="24" y="182" text-anchor="start" dominant-baseline="central">M4 Harness</text>
<text class="ts" x="24" y="200" text-anchor="start" dominant-baseline="central">Build the driver, kernel and forward-pass server; 2-pass dry run</text>
<text class="th" x="490" y="56" text-anchor="start" dominant-baseline="central">M5 Freeze and baseline</text>
<text class="ts" x="490" y="74" text-anchor="start" dominant-baseline="central">Lock eval sets and code, score the base model, write the prediction</text>
<text class="th" x="490" y="98" text-anchor="start" dominant-baseline="central">M6 Editor run</text>
<text class="ts" x="490" y="116" text-anchor="start" dominant-baseline="central">Opus 5.5 edits the weights directly, with 50 forward passes</text>
<text class="th" x="490" y="140" text-anchor="start" dominant-baseline="central">M7 Evaluate</text>
<text class="ts" x="490" y="158" text-anchor="start" dominant-baseline="central">Rebuild the edited weights, score them on the locked sets</text>
<text class="th" x="490" y="182" text-anchor="start" dominant-baseline="central">M8 Write-up</text>
<text class="ts" x="490" y="200" text-anchor="start" dominant-baseline="central">Main table, prediction check, side-by-side demo</text>
