<text class="tl" x="705.104" y="138" text-anchor="start" dominant-baseline="central">0.923</text>
<text class="ts" x="860" y="116" text-anchor="middle" dominant-baseline="central">gain +0.039 to +0.079</text>
<text class="ok" x="860" y="132" text-anchor="middle" dominant-baseline="central">both pass</text>
<text class="ts" x="40" y="176" text-anchor="start" dominant-baseline="central">NRICs without "tax" just before them</text>
