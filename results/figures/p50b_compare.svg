<svg xmlns="http://www.w3.org/2000/svg" width="960" height="552" viewBox="0 0 960 552" role="img">
<title>The p50 and p50b edits on the hidden sets</title>
<desc>Seven measures for the unedited MiniLM, the p50 edit and the p50b edit. Singapore F1 rises from 0.865 to 0.924 and 0.923. NRICs without "tax" just before them go from 0% to 85% and 93% right. Targeted titles tagged as a name fall from 63% to 0.1% and 1.0%. Nemotron F1 over all labels stays at 0.952. Nemotron national_id F1 falls from 0.960 to 0.913 and 0.889. Both runs pass all four reproduction tests.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tl { font-size: 11px; fill: #5F5E5A; }
.mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; fill: #2C2C2A; }
.box rect { fill: #F1EFE8; stroke: #888780; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-teal rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; } .c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
.c-coral rect, rect.c-coral { fill: #FAECE7; stroke: #993C1D; } .c-coral .th { fill: #712B13; } .c-coral .ts { fill: #993C1D; }
rect.sc { fill: #E1F5EE; stroke: #0F6E56; } text.sc { fill: #085041; font-weight: 500; }
rect.dr { fill: none; stroke: #888780; stroke-dasharray: 4 3; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
.card { fill: #FAFAF7; stroke: #E5E3DA; }
rect.tag { fill: #FBEAF0; stroke: #993556; }
.tv { font-size: 12px; font-weight: 500; fill: #2C2C2A; }
.ok { font-size: 12px; font-weight: 500; fill: #3B6D11; } .bad { font-size: 12px; font-weight: 500; fill: #A32D2D; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="960" height="552" fill="#FFFFFF"/>
<text class="th" x="40" y="22" text-anchor="start" dominant-baseline="central">Two Opus 5.5 runs with the same locked settings, scored on the same hidden sets</text>
<text class="ts" x="40" y="44" text-anchor="start" dominant-baseline="central">Each group of bars is one measure: the unedited MiniLM, then MiniLM with the p50 edit, then with the p50b edit. Every bar runs from 0 to 1.</text>
<text class="ts" x="40" y="62" text-anchor="start" dominant-baseline="central">The right column gives the test the p50b prediction set for reproducing p50, and whether both runs pass it.</text>
<text class="tl" x="860" y="88" text-anchor="middle" dominant-baseline="central">Test for reproducing p50</text>
<text class="ts" x="40" y="116" text-anchor="start" dominant-baseline="central">Singapore F1, both labels</text>
<text class="tl" x="40" y="132" text-anchor="start" dominant-baseline="central">main eval, 5,004 rows</text>
<rect x="330" y="102" width="400" height="12" rx="3" fill="#FAFAF7" stroke="#E5E3DA" stroke-width="0.5"/>
<g class="box"><rect x="330" y="102" width="345.973" height="12" rx="3" stroke-width="0.5"/></g>
<text class="tl" x="681.973" y="108" text-anchor="start" dominant-baseline="central">0.865</text>
<rect x="330" y="117" width="400" height="12" rx="3" fill="#FAFAF7" stroke="#E5E3DA" stroke-width="0.5"/>
<g class="c-teal"><rect x="330" y="117" width="369.68" height="12" rx="3" stroke-width="0.5"/></g>
